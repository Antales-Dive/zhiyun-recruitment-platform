services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhiyun}
      MYSQL_USER: ${MYSQL_USER:-zhiyun}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "${MYSQL_CPU_LIMIT:-1.0}"
          memory: "${MYSQL_MEMORY_LIMIT:-1G}"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-0.5}"
          memory: "${REDIS_MEMORY_LIMIT:-512M}"

  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    ports:
      # 仅绑定回环地址供本地开发/测试；生产 NFR-001 不暴露队列公网
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-zhiyun}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "${RABBITMQ_CPU_LIMIT:-0.5}"
          memory: "${RABBITMQ_MEMORY_LIMIT:-512M}"

  api:
    image: ${API_IMAGE:-zhiyun-api}:${IMAGE_VERSION:-local}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://${MYSQL_USER:-zhiyun}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-zhiyun}}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      DEFAULT_ORG_ID: ${DEFAULT_ORG_ID:-default}
      ALLOW_HEADER_AUTH: "false"
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-5}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
      RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL is required and must use the configured RabbitMQ credentials}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_CHAT_NAME: ${MODEL_CHAT_NAME:-}
    volumes:
      - app_uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-1.0}"
          memory: "${API_MEMORY_LIMIT:-768M}"

  worker:
    image: ${WORKER_IMAGE:-zhiyun-worker}:${IMAGE_VERSION:-local}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://${MYSQL_USER:-zhiyun}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-zhiyun}}
      UPLOAD_DIR: /data/uploads
      DEFAULT_ORG_ID: ${DEFAULT_ORG_ID:-default}
      RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL is required and must use the configured RabbitMQ credentials}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_CHAT_NAME: ${MODEL_CHAT_NAME:-}
    volumes:
      - app_uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-1.0}"
          memory: "${WORKER_MEMORY_LIMIT:-768M}"

  web:
    image: ${WEB_IMAGE:-zhiyun-web}:${IMAGE_VERSION:-local}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "${WEB_CPU_LIMIT:-0.5}"
          memory: "${WEB_MEMORY_LIMIT:-256M}"

networks:
  internal:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  app_uploads:
