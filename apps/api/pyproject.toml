[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008：FastAPI 的 Depends/File/Form 在参数默认值中调用是框架惯用法，非真实缺陷
extend-ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
# 遗留代码逐步补齐注解；新代码按严格标准编写
disallow_untyped_defs = false
# pika 等第三方库无类型桩，跳过其内部检查（业务侧仍有注解约束）
ignore_missing_imports = true
