[alembic]
# migration scripts directory, relative to this ini file
script_location = %(here)s/alembic
# make apps/api importable (app.config / app.infrastructure)
prepend_sys_path = %(here)s
path_separator = os
# URL is filled by alembic/env.py from app settings; tests override via Config
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
